server {
    # Non-root user: ports below 1024 are not allowed, the host port 80 is mapped to 8080 by Docker
    listen 8080;
    root /usr/share/nginx/html;

    # Compress text responses (JS, CSS, JSON of the API)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: forwarded to the backend container
    location /api/ {
        # Docker internal DNS, re-resolved every 10 s: the backend IP changes when its container is recreated
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8080;
        proxy_pass $backend;
        # Full text regex searches can be long (nginx default: 60 s)
        proxy_read_timeout 300s;
    }

    # Built files have a hash in their name (index-3fa2b1.js): they never change, cache them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React routes (/book/42...): unknown paths get index.html, and the React router displays the page
    location / {
        try_files $uri /index.html;
        # index.html must always be revalidated, so that a new build is picked up
        add_header Cache-Control "no-cache";
    }
}
