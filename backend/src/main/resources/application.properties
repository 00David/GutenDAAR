spring.application.name=backend

# Don't automatically restart the application on code change
spring.devtools.restart.enabled=false

# Web

# Listen on every network interface, so that other machines of the LAN can reach the API
server.address=0.0.0.0
# Origins allowed to call /api/** from a browser (comma-separated patterns, e.g. http://192.168.1.*:5173)
gutendaar.cors.allowed-origins=*

# Threads

# Use virtual threads for the components auto-configured by Spring Boot (Tomcat request handling,
# default task executor and scheduler); executors declared as beans by the application are not affected
spring.threads.virtual.enabled=true

# Database

# JDBC URL of the PostgreSQL database
# reWriteBatchedInserts merges batched INSERTs into multi-row statements (much faster)
spring.datasource.url=jdbc:postgresql://localhost:5432/gutendaar?reWriteBatchedInserts=true
# Database user
spring.datasource.username=daar
# Database password
spring.datasource.password=daar
# Always run schema.sql at startup (safe thanks to CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always
# Hibernate only checks that entities match the existing schema, it never modifies it
spring.jpa.hibernate.ddl-auto=validate
# Number of statements Hibernate groups into a single JDBC batch
spring.jpa.properties.hibernate.jdbc.batch_size=1000
# Sort INSERTs by entity type so that consecutive statements can be batched together
spring.jpa.properties.hibernate.order_inserts=true
# Pretty-print SQL statements when they are logged
spring.jpa.properties.hibernate.format_sql=true

# Logging

# Put 'debug' logging level below for showing debug messages on the console
logging.level.fr.sorbonne_u.gutenDAAR=info
