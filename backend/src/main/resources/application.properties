spring.application.name=backend

# Don't automatically restart the application on code change
spring.devtools.restart.enabled=false

# Database

spring.datasource.url=jdbc:postgresql://localhost:5432/gutendaar?reWriteBatchedInserts=true
spring.datasource.username=daar
spring.datasource.password=daar
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.format_sql=true

# Logging

# Put 'debug' logging level below for showing debug messages on the console
logging.level.fr.sorbonne_u.gutenDAAR=info
